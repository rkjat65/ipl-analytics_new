name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/ipl-analytics:latest
        build-args: |
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

    - name: Deploy to Oracle via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ORACLE_IP }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Login to registry on the server
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Pull the latest image
          docker pull ghcr.io/${{ github.repository_owner }}/ipl-analytics:latest
          
          # Stop and remove old container
          docker stop ipl-analytics || true
          docker rm ipl-analytics || true
          
          # Run the new container
          # Note: We mount a persistent volume for the live scores DB if needed, 
          # but the main ipl.duckdb is baked into the image.
          docker run -d \
            --name ipl-analytics \
            --restart always \
            -p 80:8000 \
            -e DUCKDB_PATH=/app/ipl.duckdb \
            ghcr.io/${{ github.repository_owner }}/ipl-analytics:latest
